<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouYi · 注册</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 动态背景（装饰层） -->
  <div class="bg-aurora"></div>
  <div class="bg-blobs">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- ============ 注册视图 ============ -->
  <section id="register-view" class="login-view">
    <div class="login-card">
      <!-- 品牌区 -->
      <div class="brand">
        <div class="logo">R</div>
        <h1>RouYi</h1>
        <p class="subtitle">创建你的工作台账号</p>
      </div>

      <!-- 注册表单：class 用 auth-form（注意和登录页的 login-form 不同） -->
      <form id="register-form" class="auth-form" autocomplete="off">
        <!-- 三个输入框：用户名 / 密码 / 确认密码，结构和登录页一致 -->
        <div class="field">
          <input id="reg-username" type="text" required placeholder=" " />
          <label for="reg-username">用户名</label>
          <span class="line"></span>
        </div>
        <div class="field">
          <input id="reg-password" type="password" required placeholder=" " />
          <label for="reg-password">密码（至少 6 位）</label>
          <span class="line"></span>
        </div>
        <div class="field">
          <input id="reg-confirm" type="password" required placeholder=" " />
          <label for="reg-confirm">确认密码</label>
          <span class="line"></span>
        </div>
        <!-- 错误提示区域 -->
        <div id="register-error" class="login-error"></div>
        <!-- 注册按钮 -->
        <button id="register-btn" type="submit" class="btn-primary">
          <span>注 册</span>
        </button>
        <!-- 跳转链接：去登录页 -->
        <p class="switch-link">已有账号？<a href="login.html">去登录</a></p>
      </form>
    </div>
  </section>

  <!-- 先引入公共脚本，再引入本页注册逻辑 -->
  <script src="common.js"></script>
  <script src="register.js"></script>
</body>
</html>
