<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouYi · 登录</title>
  <!-- 引入样式表 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 动态背景（和主应用页一样的装饰层） -->
  <div class="bg-aurora"></div>
  <div class="bg-blobs">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- ============ 登录视图 ============ -->
  <section id="login-view" class="login-view">
    <!-- 中间的登录卡片 -->
    <div class="login-card">
      <!-- 品牌区：R 图标 + 名称 + 副标题 -->
      <div class="brand">
        <div class="logo">R</div>
        <h1>RouYi</h1>
        <p class="subtitle">个人工作站</p>
      </div>

      <!-- 登录表单：id 用来让 JS 找到它；autocomplete=off 关闭浏览器自动填充 -->
      <form id="login-form" class="login-form" autocomplete="off">
        <!-- 每个 .field 是一个输入框：input（实际输入框）+ label（浮动标签）+ 下划线 -->
        <div class="field">
          <input id="username" type="text" required placeholder=" " />
          <label for="username">用户名</label>
          <span class="line"></span>
        </div>
        <div class="field">
          <input id="password" type="password" required placeholder=" " />
          <label for="password">密码</label>
          <span class="line"></span>
        </div>
        <!-- "记住我"复选框：勾选后 7 天内免登录 -->
        <label class="remember">
          <span class="checkbox"><input type="checkbox" id="remember" /><i></i></span>
          记住我（7 天内免登录）
        </label>
        <!-- 错误提示区域（默认空，出错时由 JS 写入文字） -->
        <div id="login-error" class="login-error"></div>
        <!-- 提交按钮：type=submit 会在点击时触发 form 的提交事件 -->
        <button id="login-btn" type="submit" class="btn-primary">
          <span>登 录</span>
        </button>
        <!-- 提示文字：内置演示账号 -->
        <p class="hint">演示账号：admin / admin123 &nbsp;·&nbsp; demo / demo123</p>
        <!-- 跳转链接：去注册页 -->
        <p class="switch-link">还没有账号？<a href="register.html">立即注册</a></p>
      </form>
    </div>
  </section>

  <!-- 先引入公共脚本，再引入本页登录逻辑 -->
  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
