<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouYi · 个人工作台</title>
  <!-- 引入样式表（外观都在 style.css 里） -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 动态背景（纯装饰，和登录/注册页一样） -->
  <div class="bg-aurora"></div>
  <div class="bg-blobs">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- ============ 登录后空壳页：只保留动态欢迎提示 + 退出 ============ -->
  <!-- 初始带 hidden 先隐藏，app.js 校验登录通过后再显示 -->
  <section id="app-view" class="welcome-shell hidden">
    <!-- 居中的欢迎卡片 -->
    <div class="welcome-card">
      <!-- 品牌：R 图标 + RouYi -->
      <div class="brand">
        <div class="logo">R</div>
        <h1>RouYi</h1>
      </div>
      <!-- 动态头像：首字母，颜色按用户名生成（由 app.js 填充） -->
      <div class="avatar big" id="welcome-avatar">U</div>
      <!-- 动态问候语：按时段(早上好/下午好…) + 用户名（由 app.js 填充） -->
      <h2 id="welcome-greet" class="welcome-greet">你好</h2>
      <p class="welcome-sub">欢迎回来，<span id="welcome-user">用户</span> 👋</p>
      <!-- 退出登录按钮 -->
      <button id="logout-btn" class="btn-primary">退 出 登 录</button>
    </div>
  </section>

  <!-- 先引入公共脚本（环境自检 + 统一请求封装），再引入本页逻辑 -->
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
